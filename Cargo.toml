[package]
name = "append-only-vec"
version = "0.1.9"
authors = ["David Roundy <daveroundy@gmail.com>"]

edition = "2021"

description = "Append-only, concurrent vector"
license = "MIT OR Apache-2.0"
repository = "https://github.com/droundy/append-only-vec"

readme = "README.md"
categories = ["data-structures", "concurrency"]
keywords = ["frozen", "data-structure"]


[features]
default = ["std"]
# Yield to the operating system when a push has waited a long time for
# another.  Without it the crate is `no_std` (it still needs `alloc`).
std = []

[dependencies]
# The `portable-atomic` feature: use that crate's atomics, for targets that
# lack compare-and-swap.
portable-atomic = { version = "1", default-features = false, optional = true }

[dev-dependencies]

scaling = "0.1.3"
parking_lot = "0.12"

[[bench]]
name = "bench"
harness = false
